name: Tagged Release/Prerelease

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (e.g., v1.0.0, v1.2.3-beta1)

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases and upload assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history for version tagging

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: false

      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Base URL for release asset downloads. GitHub serves every asset at a
          # predictable path, so we can link directly to APKs from the body
          # instead of making people expand the Assets accordion. Note: these
          # URLs 404 while the release is a draft (the tag isn't public yet) and
          # start resolving the moment it's published.
          echo "dl=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION from tag: $TAG_NAME"

      - name: Build Release APK
        # 60m: the pythonBackend flavors bundle a Python runtime per ABI via
        # Chaquopy and dominate the build. Маяк adds two more of them on top of
        # the four expert combos, so the old 40m budget no longer fits.
        timeout-minutes: 60
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        run: |
          # Zamolxis (expert): python backend first, then kotlin; each in
          # sentry / noSentry telemetry variants — four combos × ABI splits
          # + universal.
          #
          # Маяк ships the python backend only. It is the same code with less
          # of the machine room on screen, aimed at people who are not going to
          # reason about which RNS implementation they are running — handing
          # that audience the EXPERIMENTAL, AI-GENERATED kotlin stack would be
          # the wrong default, and doubling their choices defeats the point of
          # the flavor. Both telemetry variants stay, so the no-crash-reporting
          # build is available to them too.
          ./gradlew \
            :app:assembleExpertSentryPythonBackendRelease \
            :app:assembleExpertNoSentryPythonBackendRelease \
            :app:assembleExpertSentryKotlinBackendRelease \
            :app:assembleExpertNoSentryKotlinBackendRelease \
            :app:assembleMayakSentryPythonBackendRelease \
            :app:assembleMayakNoSentryPythonBackendRelease \
            --no-daemon --stacktrace
          echo "✓ Release APKs built successfully"

      - name: Build Release AAB (Play Store)
        # Reuses compiled classes/resources from the assemble step above, so
        # this is fast (~1m) despite the multi-flavor project. Only the
        # pythonBackend flavor is built: it's the appId (network.zamolxis.app)
        # registered with the Play Console listing — kotlinBackend (`.kt`
        # suffix) isn't published there.
        timeout-minutes: 15
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        run: |
          ./gradlew :app:bundleExpertSentryPythonBackendRelease --no-daemon --stacktrace
          echo "✓ Release AAB built successfully"

      - name: Extract signing certificate fingerprints
        id: cert
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          CERT_INFO=$(keytool -list -v -keystore app/build/keystore/release.keystore \
            -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD")
          SHA256=$(echo "$CERT_INFO" | grep "SHA256:" | awk '{print $2}')
          SHA1=$(echo "$CERT_INFO" | grep "SHA1:" | awk '{print $2}')
          if [ -z "$SHA256" ] || [ -z "$SHA1" ]; then
            echo "::error::Failed to extract certificate fingerprints"
            exit 1
          fi
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "sha1=$SHA1" >> $GITHUB_OUTPUT
          echo "✓ Extracted certificate fingerprints"

      - name: Rename APKs with version and architecture
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Three flavor dimensions (audience × telemetry × rnsImpl) mean Gradle
          # writes to app/build/outputs/apk/<audience><Telemetry><Backend>Backend/
          # release/, e.g. expertSentryPythonBackend/release/.
          #
          # The audience segment is load-bearing and was missing here: this loop
          # used to build "<telemetry><Backend>Backend" (noSentryPythonBackend),
          # which stopped existing the moment `audience` became the first flavor
          # dimension. On a clean CI checkout nothing matched, so the release
          # published with no APKs at all. Keep the directory name assembled from
          # the same three tokens Gradle uses.
          #
          # Output filenames:
          #   zamolxis-{version}-[mayak-]{backend}-{abi}[-no-sentry].apk
          # Expert keeps its historical names exactly (empty audience infix) so
          # existing download links and the tables below stay valid.
          APK_DIR="app/build/outputs/apk"

          # "<dir-token>:<filename-infix>"
          for audience in "expert:" "mayak:mayak-"; do
            dir_audience="${audience%%:*}"
            name_audience="${audience##*:}"

            # "<dir-token>:<filename-token>"
            for backend in "Python:official-rns-py" "Kotlin:EXPERIMENTAL-reticulum-kt"; do
              dir_backend="${backend%%:*}"
              name_backend="${backend##*:}"

              # Маяк is python-backend only — see the build step.
              if [ "$dir_audience" = "mayak" ] && [ "$dir_backend" != "Python" ]; then
                continue
              fi

              # "<dir-token>:<filename-suffix>"
              for telemetry in "Sentry:" "NoSentry:-no-sentry"; do
                dir_telemetry="${telemetry%%:*}"
                sentry_suffix="${telemetry##*:}"
                variant_dir="${dir_audience}${dir_telemetry}${dir_backend}Backend"

                for apk in "$APK_DIR/$variant_dir/release/"*.apk; do
                  [ -e "$apk" ] || continue
                  filename=$(basename "$apk")
                  out_stem="zamolxis-${VERSION}-${name_audience}${name_backend}"

                  if echo "$filename" | grep -q "armeabi-v7a"; then
                    cp "$apk" "${out_stem}-armeabi-v7a${sentry_suffix}.apk"
                  elif echo "$filename" | grep -q "arm64-v8a"; then
                    cp "$apk" "${out_stem}-arm64-v8a${sentry_suffix}.apk"
                  elif echo "$filename" | grep -q "x86_64"; then
                    cp "$apk" "${out_stem}-x86_64${sentry_suffix}.apk"
                  elif echo "$filename" | grep -q "universal"; then
                    cp "$apk" "${out_stem}-universal${sentry_suffix}.apk"
                  fi
                done
              done
            done
          done

          # Fail loudly rather than publishing an empty release: the bug above
          # was silent precisely because nothing checked that anything matched.
          count=$(ls -1 zamolxis-*.apk 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No APKs were collected — flavor output directories under $APK_DIR did not match. Contents:"
            ls -la "$APK_DIR" || true
            exit 1
          fi
          ls -la zamolxis-*.apk
          echo "✓ Renamed $count APKs"

      - name: Rename AAB with version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp app/build/outputs/bundle/expertSentryPythonBackendRelease/app-expert-sentry-pythonBackend-release.aab \
            "zamolxis-${VERSION}-official-rns-py.aab"
          sha256sum "zamolxis-${VERSION}-official-rns-py.aab" > "zamolxis-${VERSION}-official-rns-py.aab.sha256"
          echo "✓ Renamed AAB"

      - name: Generate SHA256 checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for apk in zamolxis-*.apk; do
            sha256sum "$apk" > "${apk}.sha256"
          done
          echo "✓ Generated SHA256 checksums"

      - name: Read SHA256 checksums
        id: sha256
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CHECKSUMS=""
          for checksum_file in zamolxis-*.apk.sha256; do
            CHECKSUMS="${CHECKSUMS}$(cat "$checksum_file")\n"
          done
          echo "checksums<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHECKSUMS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # When this release bumps reticulum-kt / LXMF-kt / LXST-kt vs the previous
      # tag, fetch the commit log between the old and new lib versions and inject
      # it into the release notes. Lib repos publish tags but not GitHub Releases,
      # so we synthesize from `compare` API output instead.
      - name: Build library-changelog injection
        id: libchangelog
        env:
          TAG_NAME: ${{ steps.version.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Find the tag that immediately precedes this one in semver order.
          PREV_TAG=$(git tag --sort=-v:refname \
            | awk -v t="$TAG_NAME" 'BEGIN{found=0} { if (found) { print; exit } if ($0==t) { found=1 } }')
          echo "previous tag: ${PREV_TAG:-(none — first release)}"

          extract_pin() {
            # Match `<var> = "<version>"` or `<var>="<version>"`. Allow:
            # - prereleases like v0.0.16-rc1
            # - a leading-`v` or no-prefix pin (`"0.0.16"`)
            # - any whitespace (or none) around `=`
            git show "$1:gradle/libs.versions.toml" 2>/dev/null \
              | sed -n -E "s/^[[:space:]]*$2[[:space:]]*=[[:space:]]*\"([^\"]+)\".*/\\1/p" \
              | head -1
          }

          NOTES=""
          # libdef format: "<libs.versions.toml var>:<github repo>"
          #
          # These libraries are no longer resolved as coordinates — their sources are
          # vendored under vendor/ (see vendor/PROVENANCE.md) and the catalog keys were
          # renamed to `vendored*` to say so. The keys are still worth reading here:
          # they record which upstream revision the vendored source was taken from, so a
          # release that follows a re-sync still gets the upstream changelog in its
          # notes. Renaming the keys without renaming them here would have left this
          # loop matching nothing and reporting "no pin" forever, quietly.
          for libdef in "vendoredReticulumKt:reticulum-kt" "vendoredLxmfKt:LXMF-kt" "vendoredLxstKt:LXST-kt"; do
            var="${libdef%%:*}"
            repo="${libdef##*:}"
            old=""
            if [ -n "$PREV_TAG" ]; then
              old=$(extract_pin "$PREV_TAG" "$var" || true)
            fi
            new=$(extract_pin "$TAG_NAME" "$var" || true)

            # Skip if not pinned in this release, or if unchanged.
            if [ -z "$new" ]; then
              echo "skip $repo: no pin in $TAG_NAME"
              continue
            fi
            if [ "$old" = "$new" ]; then
              echo "skip $repo: unchanged at $new"
              continue
            fi

            echo "$repo: ${old:-(unpinned)} -> $new"
            NOTES+=$'\n#### `'"$repo"$'` updated: `'"${old:-unpinned}"$'` → `'"$new"$'`\n\n'

            if [ -n "$old" ]; then
              # Compare link only makes sense when there's a prior version
              # to diff against — otherwise we'd render a self-compare
              # (empty diff) which is confusing.
              NOTES+="See https://github.com/torlando-tech/$repo/compare/$old...$new"$'\n\n'

              # Pull commit messages between old and new lib tags. Filter to
              # noteworthy commits and drop Conventional-Commit + Sentence-
              # Case noise (chore/ci/test/review/revert/build/style/refactor/
              # docs).
              # The two-stage filter does:
              #   ALLOW IF subject matches:
              #     - feat:/fix:/perf: with optional scope and breaking-! prefix
              #     - leading "BREAKING" marker
              #     - sentence-case lead with a curated allowlist of action verbs
              #       (Add, Fix, Improve, Support, Implement, Update, Enable,
              #       Allow, Avoid, Prevent, Make, Switch, Move, Drop, Remove,
              #       Replace, Expose, Wire, Bump, Persist, Cache, Stabilize,
              #       Optimize) — handles subjects with or without a colon
              #   AND DENY IF the leading word is a sentence-case form of a
              #   filtered conventional-commit type (Refactor/Test/Build/
              #   Style/Chore/Revert/Ci/Doc(s)?/Review).
              # This catches the failure modes from greploop on PR #908:
              #  1. `Add resource: dedup duplicate RESOURCE_ADV` no longer
              #     dropped by the colon-rejecting `[^:]+$` of the prior pass.
              #  2. `Refactor LXMRouter dispatch` no longer slipping through
              #     the sentence-case fallback that the comment claimed
              #     filtered it.
              # Errexit suppression: the `if log=$(...)` test context disables
              # `set -e` for the inner command. We log stderr instead of
              # swallowing it so failures surface in the Actions log.
              if log=$(gh api --paginate "repos/torlando-tech/$repo/compare/$old...$new" \
                  --jq '.commits[]
                        | select(.commit.message | test("^Merge ") | not)
                        | (.commit.message | split("\n")[0]) as $subject
                        | select(
                            ($subject | test("^(feat|fix|perf)(\\([^)]+\\))?!?:|^BREAKING"))
                            or
                            (
                              ($subject | test("^(Add|Fix|Improve|Support|Implement|Update|Enable|Allow|Avoid|Prevent|Make|Switch|Move|Drop|Remove|Replace|Expose|Wire|Bump|Persist|Cache|Stabilize|Optimize)\\b"))
                              and
                              ($subject | test("^(Refactor|Test|Build|Style|Chore|Revert|Ci|Docs?|Review)\\b") | not)
                            )
                          )
                        | "- " + $subject + " (`" + (.sha[0:7]) + "`)"'); then
                if [ -n "$log" ]; then
                  NOTES+="$log"$'\n'
                else
                  NOTES+="_(no user-facing feat/fix/perf commits — only chores/tests/reviews; see compare link for the full diff.)_"$'\n'
                fi
              else
                NOTES+="_(failed to fetch compare; see Actions log for the underlying error and the GitHub link above for a manual review)_"$'\n'
              fi
            else
              NOTES+="_First inclusion of this library — no prior version to diff against._"$'\n'
            fi
          done

          # If anything got injected, wrap with a section header. Empty otherwise.
          if [ -n "$NOTES" ]; then
            FINAL=$'\n### Reticulum / LXMF / LXST updates\n\nThis release picks up the following library updates:'"$NOTES"
          else
            FINAL=""
          fi

          # Use a random per-run delimiter so the heredoc can't be closed
          # early by a literal line in a fetched commit message. GitHub
          # Actions docs recommend this pattern:
          # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#multiline-strings
          delim="LIBCHANGELOG_$(openssl rand -hex 16)"
          {
            printf '%s<<%s\n' "notes" "$delim"
            printf '%s\n' "$FINAL"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # The .aab isn't linked from the body below (users can't sideload
          # it — it's Play Console upload material only) but still rides
          # along as a release asset: those don't count against Actions
          # storage quota the way workflow artifacts do.
          files: |
            zamolxis-*.apk
            zamolxis-*.apk.sha256
            zamolxis-*.aab
            zamolxis-*.aab.sha256
          # Published on the tag, not staged for review. The gate this used to
          # provide is now the build itself: the rename step fails the run when
          # it collects no APKs, which is the failure that previously produced
          # empty releases, so a run that reaches this step has assets to ship.
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          body: |
            ## Zamolxis ${{ steps.version.outputs.version }}

            ### Installation
            Pick a **backend**, then download the APK matching your device's CPU architecture.

            - **Python backend, RECOMMENDED** — ships Mark Qvist's official python reference implementations of Reticulum and LXMF via Chaquopy.
            - **Kotlin backend** — ships Torlando's EXPERIMENTAL, AI-GENERATED native reticulum-kt / lxmf-kt / lxst-kt stack.

            The python version is highly recommended. The kotlin version is a work in progress, and is not yet verified to be completely safe.
            The kotlin version may yield better battery life depending on your device, and comes in a smaller apk due to not requiring a python runtime.

            #### Python backend (`official-rns-py`)
            | APK | Architecture | Devices |
            |-----|-------------|---------|
            | [`zamolxis-${{ steps.version.outputs.version }}-official-rns-py-armeabi-v7a.apk`](${{ steps.version.outputs.dl }}/zamolxis-${{ steps.version.outputs.version }}-official-rns-py-armeabi-v7a.apk) | armeabi-v7a | Older 32-bit ARM phones & tablets |
            | [`zamolxis-${{ steps.version.outputs.version }}-official-rns-py-arm64-v8a.apk`](${{ steps.version.outputs.dl }}/zamolxis-${{ steps.version.outputs.version }}-official-rns-py-arm64-v8a.apk) | arm64-v8a | Most modern Android phones & tablets |
            | [`zamolxis-${{ steps.version.outputs.version }}-official-rns-py-x86_64.apk`](${{ steps.version.outputs.dl }}/zamolxis-${{ steps.version.outputs.version }}-official-rns-py-x86_64.apk) | x86_64 | Chromebooks, emulators, some tablets |
            | [`zamolxis-${{ steps.version.outputs.version }}-official-rns-py-universal.apk`](${{ steps.version.outputs.dl }}/zamolxis-${{ steps.version.outputs.version }}-official-rns-py-universal.apk) | All | Universal fallback (larger download) |

            #### Kotlin backend (`EXPERIMENTAL-reticulum-kt`)
            | APK | Architecture | Devices |
            |-----|-------------|---------|
            | [`zamolxis-${{ steps.version.outputs.version }}-EXPERIMENTAL-reticulum-kt-armeabi-v7a.apk`](${{ steps.version.outputs.dl }}/zamolxis-${{ steps.version.outputs.version }}-EXPERIMENTAL-reticulum-kt-armeabi-v7a.apk) | armeabi-v7a | Older 32-bit ARM phones & tablets |
            | [`zamolxis-${{ steps.version.outputs.version }}-EXPERIMENTAL-reticulum-kt-arm64-v8a.apk`](${{ steps.version.outputs.dl }}/zamolxis-${{ steps.version.outputs.version }}-EXPERIMENTAL-reticulum-kt-arm64-v8a.apk) | arm64-v8a | Most modern Android phones & tablets |
            | [`zamolxis-${{ steps.version.outputs.version }}-EXPERIMENTAL-reticulum-kt-x86_64.apk`](${{ steps.version.outputs.dl }}/zamolxis-${{ steps.version.outputs.version }}-EXPERIMENTAL-reticulum-kt-x86_64.apk) | x86_64 | Chromebooks, emulators, some tablets |
            | [`zamolxis-${{ steps.version.outputs.version }}-EXPERIMENTAL-reticulum-kt-universal.apk`](${{ steps.version.outputs.dl }}/zamolxis-${{ steps.version.outputs.version }}-EXPERIMENTAL-reticulum-kt-universal.apk) | All | Universal fallback (larger download) |

            ### Маяк

            Same app, same protocol, same vendored stack — with the machine room off
            screen. No announce stream, no interface management, no RNode wizard: it
            reads as a plain messenger. Install it alongside Zamolxis if you like;
            it has its own application id and does not replace it.

            Маяк ships the **python backend only** — the audience it is for should not
            have to choose an RNS implementation, and the kotlin stack is experimental.

            | APK | Architecture | Devices |
            |-----|-------------|---------|
            | [`zamolxis-${{ steps.version.outputs.version }}-mayak-official-rns-py-armeabi-v7a.apk`](${{ steps.version.outputs.dl }}/zamolxis-${{ steps.version.outputs.version }}-mayak-official-rns-py-armeabi-v7a.apk) | armeabi-v7a | Older 32-bit ARM phones & tablets |
            | [`zamolxis-${{ steps.version.outputs.version }}-mayak-official-rns-py-arm64-v8a.apk`](${{ steps.version.outputs.dl }}/zamolxis-${{ steps.version.outputs.version }}-mayak-official-rns-py-arm64-v8a.apk) | arm64-v8a | Most modern Android phones & tablets |
            | [`zamolxis-${{ steps.version.outputs.version }}-mayak-official-rns-py-x86_64.apk`](${{ steps.version.outputs.dl }}/zamolxis-${{ steps.version.outputs.version }}-mayak-official-rns-py-x86_64.apk) | x86_64 | Chromebooks, emulators, some tablets |
            | [`zamolxis-${{ steps.version.outputs.version }}-mayak-official-rns-py-universal.apk`](${{ steps.version.outputs.dl }}/zamolxis-${{ steps.version.outputs.version }}-mayak-official-rns-py-universal.apk) | All | Universal fallback (larger download) |

            **Telemetry variants:**
            Each APK above also has a `-no-sentry` variant without crash reporting for maximum privacy — append `-no-sentry` to any download link above (e.g. the most common builds: [Python arm64-v8a no-sentry](${{ steps.version.outputs.dl }}/zamolxis-${{ steps.version.outputs.version }}-official-rns-py-arm64-v8a-no-sentry.apk) · [Kotlin arm64-v8a no-sentry](${{ steps.version.outputs.dl }}/zamolxis-${{ steps.version.outputs.version }}-EXPERIMENTAL-reticulum-kt-arm64-v8a-no-sentry.apk)). Sentry collects stack traces when Zamolxis encounters errors
            and provides helpful information to the developer to improve Zamolxis, but is hosted at sentry.io, and is thus not the maximum privacy option.

            > **Not sure which to pick?** Most Android phones use **arm64-v8a**. If unsure, use the **universal** APK.

            ### Verification
            See [SECURITY.md](https://github.com/c0d3craft3r13/zamolxis/blob/main/SECURITY.md) for verification instructions.

            **Signing Certificate Fingerprints:**
            ```
            SHA-256: ${{ steps.cert.outputs.sha256 }}
            SHA-1:   ${{ steps.cert.outputs.sha1 }}
            ```

            **SHA256 Checksums:**
            ```
            ${{ steps.sha256.outputs.checksums }}
            ```
            ${{ steps.libchangelog.outputs.notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zamolxis-${{ steps.version.outputs.version }}-apks
          path: zamolxis-*.apk
          # Short retention: these duplicate the Release assets (which don't count
          # toward Actions storage). 1 day keeps them handy for a quick download
          # (e.g. sideloading to a phone) without piling up against the quota.
          retention-days: 1
