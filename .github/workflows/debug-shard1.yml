# TEMPORARY diagnostic workflow — delete after the shard-1 hang is found.
#
# Round 1 result: all eight sub-shards of shard 1 (i%32 in {1,5,...,29}) PASSED
# on Linux CI in ~5 min each, while the full 71-class shard hangs and burns the
# entire job timeout (15m, then 20m, twice). So no single class hangs — the stall
# emerges only in the full-shard run.
#
# Round 2 (this version): run the FULL shard 1 under a shell-level 20m timeout,
# then — pass or killed — compute which classes never produced a JUnit XML result
# and push that list to refs/heads/debug/shard1-report. The report branch matches
# no CI trigger, so the push does not recurse.

name: DEBUG shard1 probe

on:
  push:
    branches: [ 'zamolxis/**' ]

permissions:
  contents: write  # push the report branch

jobs:
  shard1-full-probe:
    name: "Shard1 full probe (report -> debug/shard1-report)"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean AIDL generated code
        run: |
          rm -rf app/build/generated/aidl_source_output_dir
          rm -rf */build/generated/aidl_source_output_dir

      - name: Snapshot memory while tests run
        run: |
          ( for i in $(seq 1 40); do
              echo "== t=${i}x30s ==" >> /tmp/mem.log
              free -m >> /tmp/mem.log
              sleep 30
            done ) &
          echo "memory sampler started"

      - name: Run full shard 1 (shell-capped at 20m)
        run: |
          timeout 20m ./gradlew :app:testExpertNoSentryKotlinBackendDebugUnitTest \
            -PtestShard=1 -PtestShardTotal=4 --stacktrace --max-workers=4 || true

      - name: Build the missing-classes report
        if: always()
        run: |
          set -e
          SRC=app/src/test/java
          RES=app/build/test-results/testExpertNoSentryKotlinBackendDebugUnitTest
          cd "$SRC"
          find . -name '*Test.kt' | sed 's|^\./||; s|/|.|g; s|\.kt$||' | LC_ALL=C sort \
            | awk 'NR%4==2' > /tmp/expected.txt
          cd "$OLDPWD"
          ls "$RES" 2>/dev/null | sed -n 's/^TEST-\(.*\)\.xml$/\1/p' | LC_ALL=C sort > /tmp/done.txt || true
          {
            echo "# shard1 probe report — $(date -u +%FT%TZ)"
            echo
            echo "## expected classes: $(wc -l < /tmp/expected.txt)"
            echo "## completed (XML written): $(wc -l < /tmp/done.txt)"
            echo
            echo "## MISSING (no result XML — hang frontier):"
            comm -23 /tmp/expected.txt /tmp/done.txt
            echo
            echo "## memory sampler tail:"
            tail -30 /tmp/mem.log 2>/dev/null || echo "(no sampler log)"
          } > shard1-report.txt
          cat shard1-report.txt

      - name: Push report to debug/shard1-report
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "shard1-probe"
          git config user.email "noreply@anthropic.com"
          git checkout -B debug/shard1-report
          git add shard1-report.txt
          git commit -m "shard1 probe report $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" debug/shard1-report
