# NOTE: plugin versions (Kotlin, KSP, AGP, ktlint, detekt, Hilt) are declared in the
# root build.gradle.kts `plugins {}` block, not here. Entries for `kotlin`, `compose`,
# `ktlint` and `detekt` used to sit in this file unreferenced by anything, drifting out
# of sync with the real values (they claimed Kotlin 2.3.20 / detekt 1.23.7 while the
# build ran 2.3.21 / 1.23.8). They were removed rather than fixed — a version that
# nothing reads can only mislead. Keep plugin versions in build.gradle.kts.
[versions]
# CEILING: compileSdk 36. Newer releases of the androidx stack (compose 1.12.x via
# BOM 2026.08.00, core 1.19.0, lifecycle 2.11.0, hilt-navigation 1.4.0, markdown
# 0.43.0) set an AAR-metadata floor of compileSdk 37, and android-37 is not published
# as a stable SDK platform yet — cmdline-tools 17.0 lists android-36.1 as the newest.
# Those versions are built against a preview SDK. Raise these together once android-37
# ships stable and AGP supports it (AGP 9.1.0 caps its recommendation at 36).
composeBom = "2026.06.01"
hilt = "2.60.1"
room = "2.8.4"
coroutines = "1.11.0"
lifecycle = "2.10.0"
navigation = "2.9.8"

bouncycastle = "1.85.2"
sqlcipher = "4.11.0"
msgpack = "0.9.12"
dataStore = "1.2.1"
paging = "3.5.1"
zxing = "3.5.4"
cameraX = "1.6.1"
serialization = "1.11.0"
coil = "2.7.0"
markdownRenderer = "0.41.0" # held: both 0.42.0 and 0.43.0 require compileSdk 37
desugarJdkLibs = "2.1.5"

# JitPack-published libraries (formerly git submodules)
reticulumKt = "v0.0.22"
lxmfKt = "v0.0.14"
lxstKt = "v0.0.8"

[libraries]
# JitPack-published Reticulum/LXMF/LXST stack (migrated from git submodules)
# Note: lxmfKt and lxstKt use JitPack's single-module root-coord collapse
# (coord = repo name, not repo/module path), while reticulum-kt has 3 modules.
rns-core = { module = "com.github.torlando-tech.reticulum-kt:rns-core", version.ref = "reticulumKt" }
rns-interfaces = { module = "com.github.torlando-tech.reticulum-kt:rns-interfaces", version.ref = "reticulumKt" }
rns-android = { module = "com.github.torlando-tech.reticulum-kt:rns-android", version.ref = "reticulumKt" }
lxmf-kt = { module = "com.github.torlando-tech:LXMF-kt", version.ref = "lxmfKt" }
lxst-kt = { module = "com.github.torlando-tech:LXST-kt", version.ref = "lxstKt" }

# Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material3-windowsizeclass = { module = "androidx.compose.material3:material3-window-size-class" }
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-activity = { module = "androidx.activity:activity-compose", version = "1.13.0" }
compose-test = { module = "androidx.compose.ui:ui-test-junit4" }
markdown-renderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdownRenderer" }
markdown-renderer-code = { module = "com.mikepenz:multiplatform-markdown-renderer-code", version.ref = "markdownRenderer" }
navigation = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# Hilt
hilt = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-navigation = { module = "androidx.hilt:hilt-navigation-compose", version = "1.3.0" } # 1.4.0 requires compileSdk 37
hilt-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }

# Room
room = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# Coroutines
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Lifecycle
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
lifecycle-runtime-testing = { module = "androidx.lifecycle:lifecycle-runtime-testing", version.ref = "lifecycle" }

# Core
core-ktx = { module = "androidx.core:core-ktx", version = "1.18.0" } # 1.19.0 requires compileSdk 37

# Android Java 8+ API desugaring — required so java.time.* (LocalTime,
# LocalDateTime, …) used transitively by reticulum-kt's AutoInterface
# resolves on minSdk 24 devices. Without this the kotlinBackend flavor
# throws NoClassDefFoundError: java.time.LocalTime at startInterface().
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }

# DataStore
datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "dataStore" }

# Paging
paging-runtime = { module = "androidx.paging:paging-runtime", version.ref = "paging" }
# was pinned to a hardcoded 3.3.5 while `paging` said 3.3.6 — the two ship as a set
paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }
paging-testing = { module = "androidx.paging:paging-testing", version.ref = "paging" }

# MessagePack
# ML-KEM (FIPS 203) + X25519 for the hybrid post-quantum content layer.
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
sqlcipher = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }
msgpack = { module = "org.msgpack:msgpack-core", version.ref = "msgpack" }

# Serialization
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Coil (image loading with GIF support)
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
coil-gif = { module = "io.coil-kt:coil-gif", version.ref = "coil" }

# QR Code & Camera
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
cameraX-core = { module = "androidx.camera:camera-core", version.ref = "cameraX" }
cameraX-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "cameraX" }
cameraX-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "cameraX" }
cameraX-view = { module = "androidx.camera:camera-view", version.ref = "cameraX" }

# Testing
junit = { module = "junit:junit", version = "4.13.2" }
# Held on JUnit 5.x: 6.x is a major with a raised Java baseline and API removals.
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version = "5.14.4" }
mockk = { module = "io.mockk:mockk", version = "1.14.11" }
mockk-android = { module = "io.mockk:mockk-android", version = "1.14.11" }
turbine = { module = "app.cash.turbine:turbine", version = "1.2.1" }
arch-core-testing = { module = "androidx.arch.core:core-testing", version = "2.2.0" }
robolectric = { module = "org.robolectric:robolectric", version = "4.16.1" }
test-core = { module = "androidx.test:core", version = "1.7.0" }
junit-android = { module = "androidx.test.ext:junit", version = "1.3.0" }
espresso = { module = "androidx.test.espresso:espresso-core", version = "3.7.0" }
test-orchestrator = { module = "androidx.test:orchestrator", version = "1.6.1" }
test-services = { module = "androidx.test.services:test-services", version = "1.6.0" }
